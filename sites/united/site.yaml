# Site pack: United Airlines
# The platform reads this file; it never names a site itself. Validated against platform/contract/schemas/site-pack.json.
# History: inferred from two signed-out HAR recordings (2026-11-06: a search, and a booking up to payment) and four
# console checks in the user's own Chrome on united.com (the anonymous token, a lookup and a search with our own token).
# Read-only and signed out: booking, seats and cancelling are handoffs to United's own pages. Nothing here has been
# reviewed by United. Findings and open checks: research/FINDINGS.md.

site:
  id: united
  name: United Airlines
  origins: [https://www.united.com]
  pages: ["https://www.united.com/*"]
  locale: en-US
  brandColor: "#1414d2"     # the blue of united.com's own Select buttons (2026-11-13)
  pageTypes: [home, results, other]
  requires:
    location: none
    signIn: never           # signed-out fares; MileagePlus benefits apply when the traveler signs in on united.com

entities:
  airport:
    description: An airport, or all of a city's airports, as a search's start or end
    id: { type: string, pattern: "^([A-Z]{3}|[A-Z][A-Z .'-]* \\(ALL AIRPORTS\\))$" }
    noPage: true
    fields:
      name: { label: Airport, type: text, from: name }
      code: { label: Code, type: text, from: code }
      country: { label: Country, type: text, from: country }
    card: { title: "{name}", fields: [code, country] }
  flight:
    description: One flight option in one search, nonstop or with connections, and its fares
    id: { type: string, pattern: "^[0-9]+-[0-9A-Z|]+-[A-Z0-9]{2}$" }
    noPage: true            # a flight has no page of its own; Take me there opens the search's results
    expires: { afterSeconds: 1800 }
    fields:
      lowestFare: { label: From, type: money, from: lowestFare }
      route: { label: Route, type: text, from: route }
      departs: { label: Departs, type: text, from: departs }
      arrives: { label: Arrives, type: text, from: arrives }
      stops: { label: Stops, type: integer, from: stops }
      duration: { label: Duration, type: text, from: duration }
      aircraft: { label: Aircraft, type: text, from: aircraft }
      operatedBy: { label: Operated by, type: text, from: operatedBy }
    card:
      title: "{flightNumbers}"
      subtitle: "{route}: {departs} to {arrives}"
      fields: [lowestFare, stops, duration]
      destination: flight_on_united   # United has no page per flight: its search's results page, with its details open
  fare:
    description: One fare on one flight option, such as United Economy or Polaris business, with its price and rules
    id: { type: string, pattern: "^[A-Za-z0-9]{20,32}(_[A-Z]{2})?$" }
    noPage: true
    expires: { afterSeconds: 1800 }
    fields:
      totalPrice: { label: Total price, type: money, from: totalPrice }
      cabin: { label: Cabin, type: text, from: cabin }
      refundable: { label: Refundable, type: boolean, from: refundable }
      noChangeFees: { label: No change fees, type: boolean, from: noChangeFees }
      checkedBags: { label: Checked bags, type: text, from: checkedBags }
      carryOn: { label: Carry-on, type: text, from: fare_details }
      seat: { label: Seat, type: text, from: seat }
      changes: { label: Changes, type: text, from: changes }
      refunds: { label: Refunds, type: text, from: fare_details }
      upgrades: { label: Upgrades, type: text, from: upgrades }
      lounge: { label: Lounges, type: text, from: lounge }
      flightNumbers: { label: Flight, type: text, from: flightNumbers }
      schedule: { label: Schedule, type: text, from: schedule }
    # Fares on different flights often share a name ("United Economy"), so the card leads with the flight. Bags and
    # refunds come from fare_details; until it's called for a fare they read "not checked", never as a no.
    card: { title: "{flightNumbers}, {name}", subtitle: "{schedule}", fields: [totalPrice, carryOn, refunds], destination: fare_on_united }
  search_session:
    description: United's search session (it calls it a cart, though nothing is in it); later calls about the search name it
    id: { type: string, pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$" }
    internal: true
    expires: { afterSeconds: 1800 }

endpoints:
  token:
    description: An anonymous token, valid for an hour, that every other call sends
    method: GET
    url: https://www.united.com/api/token/anonymous
    request: endpoints/token.request.json
    response: endpoints/token.response.json
    matchKey: []
    verified: "2026-11-06, the user's console"
  airports:
    description: Airports and cities matching typed text
    method: GET
    url: https://www.united.com/api/airports/lookup/
    request: endpoints/airports.request.json
    response: endpoints/airports.response.json
    matchKey: [airport, allAirports, matches]
    verified: "2026-11-06, the user's console, with our own token"
  flights:
    description: Flight search, one direction at a time, streamed as it runs (a round trip lists outbound flights priced as round trips)
    method: POST
    url: https://www.united.com/api/flight/FetchSSENestedFlights
    request: endpoints/flights.request.json
    response: endpoints/flights.response.json
    responseFormat: sse
    eventKind: type
    timeoutSeconds: 45      # 6 to 13 seconds seen
    matchKey: [SearchTypeSelection, "Trips[].Origin", "Trips[].Destination", "Trips[].DepartDate", "Trips[].SearchFiltersIn.FareFamily", "Trips[].SearchFiltersIn.StopCountMax", CabinPreferenceMain, "PaxInfoList[].PaxType", SortType]
    ids:
      - { kind: search_session, path: "meta[].cartId" }
      - { kind: flight, path: "flightOption[].flight.hash" }
      - { kind: fare, path: "flightOption[].flight.products[].productId" }
    verified: "2026-11-06, the user's console, with our own token: 200 in 5.9 s"
  return_flights:
    description: Return flights for a chosen outbound fare, priced as round trips with it, streamed
    method: POST
    url: https://www.united.com/api/flight/SelectAndFetchSSENestedFlights
    request: endpoints/return_flights.request.json
    response: endpoints/return_flights.response.json
    responseFormat: sse
    eventKind: type
    timeoutSeconds: 45
    matchKey: [BBXCellId, flightHash]   # the search session (CartId) is a per-call ID: fixtures don't match on it
    ids:
      - { kind: flight, path: "flightOption[].flight.hash" }
      - { kind: fare, path: "flightOption[].flight.products[].productId" }
    verified: recording 2026-11-06
  fare_details:
    description: What each fare on one flight option includes (bags, changes, refunds, seats, lounges)
    method: POST
    url: https://www.united.com/api/flight/NestedCabinEntitlements
    request: endpoints/fare_details.request.json
    response: endpoints/fare_details.response.json
    matchKey: [FlightHash]
    verified: recording 2026-11-06
  calendar:
    description: The lowest fare for each date (one way) or pair of dates (round trip) around the ones asked
    method: POST
    url: https://www.united.com/api/FlexPricer/CalendarPricing
    request: endpoints/calendar.request.json
    response: endpoints/calendar.response.json
    matchKey: [Origin, Destination, Depart, Return, IsOneway, IsPremium, Travelers.Adult]
    verified: recording 2026-11-06

token:
  endpoint: token
  value: data.token.hash
  expiresAt: data.token.expiresAt
  header: X-Authorization-api
  format: "bearer {token}"
  refusedStatuses: [405, 401, 403]   # 405 is what United answered without a token (2026-11-06)

tools:
  find_airport:
    description: Airports and cities matching a name or code; a city with several airports also comes as all of its airports
    input: tools/find_airport.input.json
    output: tools/find_airport.output.json
    uses: [airports]
    sideEffect: read
    ids: { output: [{ kind: airport, path: "airports[].place" }] }
  search_flights:
    description: >-
      Search United flights. For a round trip it lists the outbound flights, each priced as the whole round trip; after
      the traveler picks an outbound fare, return_flights lists the returns. Prices include taxes and fees, for all
      travelers.
    input: tools/search_flights.input.json
    output: tools/search_flights.output.json
    uses: [flights]
    sideEffect: read
    presentation: present_items
    ids:
      output:
        - { kind: flight, path: "flights[].flightId" }
        - { kind: fare, path: "flights[].fares[].fareId" }
    nextStep: Fares expire after about 30 minutes; if the traveler comes back later, search again before quoting a price.
    errors:
      no_flights: { code: no_results, message: "United found no flights for this search. Try other dates, nearby airports, or allow stops.", retryable: true }
  return_flights:
    description: The return flights for a round trip, after the traveler picked an outbound fare, each priced as the whole round trip with it
    input: tools/return_flights.input.json
    output: tools/return_flights.output.json
    uses: [return_flights]
    sideEffect: read
    presentation: present_items
    ids:
      input: [{ kind: fare, path: fareId }]
      output:
        - { kind: flight, path: "flights[].flightId" }
        - { kind: fare, path: "flights[].fares[].fareId" }
    errors:
      not_round_trip: { code: invalid_value, message: "That fare is from a one-way search, or is already a return fare, so it has no return flights. Search a round trip.", retryable: true }
      search_again: { code: expired, message: United's search for that fare is gone from this page. Run the search again first., retryable: true }
      no_flights: { code: no_results, message: United found no return flights for that fare. Pick another outbound fare., retryable: true }
  fare_details:
    description: What each fare on one flight includes, such as checked bags, carry-on, change fees, refunds, seat choice and lounge access
    input: tools/fare_details.input.json
    output: tools/fare_details.output.json
    uses: [fare_details]
    sideEffect: read
    presentation: present_comparison
    ids:
      input: [{ kind: flight, path: flightId }]
      output: [{ kind: fare, path: "fares[].fareId" }]
    errors:
      search_again: { code: expired, message: United's search for that flight is gone from this page. Run the search again first., retryable: true }
  fare_calendar:
    description: The lowest fare for each date around the ones asked (round trip pairs, or one-way dates), to find cheaper days
    input: tools/fare_calendar.input.json
    output: tools/fare_calendar.output.json
    uses: [calendar]
    sideEffect: read

forms:
  flight_search:
    description: What the agent asks for when a search is missing details
    fields:
      from: { label: From, type: text, required: true }
      to: { label: To, type: text, required: true }
      departDate: { label: Depart, type: date, required: true }
      returnDate: { label: Return, type: date }
      adults: { label: Travelers, type: integer, min: 1, max: 9 }
      cabin: { label: Cabin, type: select, options: [economy, business_or_first] }
    submitTool: search_flights

notices:
  fares_include_taxes:
    text: Fares include taxes and fees, for all travelers.
    source: US DOT full-fare advertising rule; United's own results show fares with taxes
    version: "2026-11-06"
    showWith: [lowestFare, totalPrice]
  signed_out_fares:
    text: These are United's signed-out fares. MileagePlus benefits, such as free checked bags for some members, show when you sign in on united.com.
    source: our wording; the agent searches signed out
    version: "2026-11-06"
    showWith: [lowestFare, totalPrice]

policies:
  hiddenFields: []
  pageSize: 12
  rateLimitPerSecond: 1
  callBudget: { perTask: 30, perSession: null, perDay: null }
  priceDisplay: total_including_taxes
  writes: none

deepLinks:
  results_round_trip:
    template: "https://www.united.com/en/us/fsr/choose-flights?f={from}&t={to}&d={departDate}&r={returnDate}&sc={cabinCode},{cabinCode}&px={adults}&taxng=1&clm=7&st=bestmatches&tqp=R"
    description: United's results page for a round-trip search, as its own search form opens it
  results_one_way:
    template: "https://www.united.com/en/us/fsr/choose-flights?f={from}&t={to}&d={departDate}&sc={cabinCode}&px={adults}&taxng=1&clm=7&st=bestmatches&tqp=O"
    description: United's results page for a one-way search (one way not recorded yet)
  home:
    template: "https://www.united.com/en/us/"

destinations:
  flight_search:
    title: These flights on United
    description: United's results page for this search, where the traveler picks a fare, chooses seats and books; the agent never books
    argsOf: search_flights
  flight_on_united:
    title: This flight on United
    description: United's results page for the search that found this flight, with the flight's details opened there; the traveler selects it and books on United. A return flight's page opens its outbound flight, which the traveler selects first
    params:
      flightId: { type: string, entity: flight, description: A flight a search returned }
    pageAction: open_flight_details
  fare_on_united:
    title: This fare on United
    description: United's results page for the search that found this fare, with the fare's options opened under its flight and the fare scrolled to; the traveler selects it there. A return fare's page opens its outbound flight's details instead. Use it when the traveler wants to see or book a fare they chose
    params:
      fareId: { type: string, entity: fare, description: A fare a search or fare_details returned }
    pageAction: open_fare_options
  add_fare_to_cart:
    title: Add this fare to your United cart
    description: A confirming button that, when the traveler presses it, opens the results page and presses this fare's own Select there, which puts it in United's cart; seats, traveler details and payment stay with the traveler. Only when the traveler asks to add a fare they chose to the cart or to select it for them. Only a one-way fare or an outbound fare from a search; never a return fare (the traveler selects the outbound on United first). Basic fares stop before United's terms box, which the traveler ticks themselves
    params:
      fareId: { type: string, entity: fare, description: A fare a search returned }
    pageAction: add_fare_to_cart
  united_home:
    title: United's home page
    description: The place to sign in, manage a trip, check in, or cancel; the agent can't do these
    link: home

pageActions:
  open_flight_details:
    description: On United's results page, scrolls to the chosen flight and opens its Details, which show its flight numbers, aircraft and times. Never Select, which puts the flight in a cart
    effect: shows_information
    pageTypes: [results]
  open_fare_options:
    description: On United's results page, opens the chosen flight's cabin ("Select a fare to continue") and scrolls to the chosen fare's card, with its price and rules. Never Select
    effect: shows_information
    pageTypes: [results]
  add_fare_to_cart:
    description: On United's results page, opens the chosen fare's card and presses its own Select, once, if its price is the one the traveler confirmed. Never ticks Basic's terms box, and never goes past the cart
    effect: changes_site_state
    pageTypes: [results]
    button: Add to cart on United
    consent: "Opens United's results and presses Select on this fare, which puts it in your United cart. Nothing is bought: you choose seats, enter travelers and pay on United."
    done: "United shows it in your cart: {hint}. Seats, travelers and payment are next, on United."


skills:
  flight_search:
    description: Turning travel plans into a United search, round trips, fare rules and cheaper dates
    load: on demand; preloaded on the home and results pages
    pageTypes: [home, results]

recording:
  hars: [recordings/www.united.com.searchflight.har, recordings/www.united.com.allthewayToCheckout.har]
  scrubFields: [CartId, cartId, SessionId, sessionKey, lastResultId, LastBBXSolutionSetId, BBXSolutionSetId, EditSearchCartId]
  scrubHeaders: []
  keepHeaders: [accept, content-type]
