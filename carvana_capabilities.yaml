# Carvana capability manifest (draft)
# Inferred from one HAR recording (2026-10-08, signed out, read-only).
# Updated 2026-10-10 after reviewing Anthropic's "The anatomy of effective commerce agents":
# presentation tools, ID rules, sanitizer, financing-figure policy, shared call budget, next-step hints and errors.
# Updated 2026-10-12 after the phase 0 live checks: required tracking fields, routeId format, vehicle page, explicit zip code.
# Source: www.carvana.com.har, 252 requests, 37 of them to apik.carvana.io
# Confidence: traffic = number of samples seen in the recording. Nothing here has been reviewed by Carvana.

base_urls:
  merch: https://apik.carvana.io/merch
  ancillary: https://apimpub.carvana.com/ancillary-products-api

# ---------- Raw endpoints (observed in traffic) ----------
raw_endpoints:
  - id: search
    call: POST /search/api/v2/search
    inputs: [filters, sortBy, "pagination{page, pageSize}", zip5, "requestedFeatures[]"]
    outputs: ["inventory.vehicles[] (vehicleId, stockNumber, make, model, trim, year, mileage, color, price{total, monthlyPayment, apr, term, kbbValue, estimatedTaxesAndFees}, locationId, vdpSlug)", financeInfo, userDeliveryInfo]
    side_effect: read
    traffic: 6
  - id: search_facets
    call: POST /search/api/v2/search/facets
    outputs: ["valid values and counts per filter: bodyStyles, colors, interiorColors, driveTypes, ..."]
    side_effect: read
    traffic: 6
  - id: suggest_filters
    call: POST /search/api/v1/suggest/filters
    outputs: ["suggestedFilters[] (suggestionId, displayName, searchFilters, totalMatchedInventory)"]
    requires: [browserCookieId, analyticsData.clientId (srp_ui)]   # fails with "Invalid Request" without them (phase 0)
    side_effect: read
    traffic: 6
  - id: soonest_availability
    call: POST /buffering/api/v1/soonestavailabilitybulk
    inputs: ["vehicles[] (vehicleId, vehicleLocationId, vehicleInventoryType, vehicleSaleStatus)", zipCode]
    outputs: ["soonestDelivery / soonestPickup (date, asSoonAsText, locationCity, routeId)"]
    side_effect: read
    traffic: 10
    note: takes a list of vehicles, so one call covers a whole results page
    headers_sent: [clientid, browsercookieid, correlationid]   # the frontend's set, with fresh IDs; not tested without them
    inventory_type_mapping: search's vehicleInventoryType 1 -> Core, 2 -> Unknown (seen on an on-demand car)
    other_shape: the vehicle page sends a different body (no userId or sale status, header clientid vdp_ui); documented in the contract, never sent by us
  - id: vehicle_pricing
    call: POST /search/api/v2/pricing/vehicle
    inputs: [vehicleId, zip5, routeId, applyTradeIn]
    outputs: ["price (total, monthlyPayment, apr, term, estimatedTaxesAndFees, msrp)", "financeInfo (isUsingSampleTerms, maxMonthlyPayment)"]
    requires: [analyticsData.clientId (vdp_ui)]   # fails with "ClientId cannot be null" without it (phase 0)
    side_effect: read
    traffic: 1
  - id: reviews
    call: POST /reviews/api/review/sv
    inputs: [make, model, trim, year, from, size]
    outputs: ["summary (rating_counts)", "reviews[]"]
    side_effect: read
    traffic: 1
    note: third-party user text; always passes through the sanitizer
  - id: similar_vehicles
    call: POST /search/api/v1/recommendations/personalized-recs
    inputs: [filters (based on the current vehicle), clientId=vdp_ui]
    side_effect: read
    traffic: 4
  - id: delivery_zones
    call: GET /search/api/v1/Delivery?Zip5=
    side_effect: read
    traffic: 1
  - id: location_distances
    call: GET /carvanamerchcontextapi/api/v3/distance?zip5=
    side_effect: read
    traffic: 1
  - id: gap_waiver
    call: GET /api/v2/GapWaiver/availability (ancillary)
    inputs: [vehicleId, amountFinanced, homeState, paymentType, institutionName]
    outputs: [isGapWaiverAvailable, price]
    side_effect: read
    traffic: 1
  - id: vehicle_page
    call: GET https://www.carvana.com/vehicle/{vehicleId} (HTML)
    outputs: [vin, "features (by category)", "imperfections (title, description, location, photo)", options, packages, highlights, exteriorColor, price, mileage]
    source: the Next.js data embedded in the page (self.__next_f.push chunks), read from the DOM
    side_effect: read
    traffic: 0   # not in the HAR; verified live in phase 0 for two cars (0.24 s, 164 KB)
    note: the site framework's internal format; validated against the contract and watched by the change monitor

# ---------- Data flow (fields passed between endpoints) ----------
dataflow:
  - search.vehicles[].vehicleId, locationId -> soonest_availability.vehicles[]
  - soonest_availability.soonestDelivery.routeId -> vehicle_pricing.routeId
  - vehicle_pricing.price.total + estimatedTaxesAndFees -> gap_waiver.amountFinanced   # 35590 + 3837 = 39427, verified
  - vehicle (make, model, trim, year) -> reviews
  - search.filters <-> URL parameter cvnaid (base64 JSON of the filters)   # deep link back to the same search on the site

# ---------- routeId (decoded in phase 0) ----------
route_id:
  format: gzip-compressed, base64url-encoded JSON
  example: '{"geo":209644,"loc":335,"act":2,"vdt":2,"prc":{"cli":301,"pym":1},"drm":36,"ver":2,"cst":"CA","czp":"94402"}'
  fields:
    loc: servicing location (matches servicingLocationId)
    drm: driving miles (matches drivingMiles)
    act: 2 = delivery, 5 = pickup
    prc.cli: closest location (matches closestLocationId)
    cst, czp: customer state and zip code
    geo, vdt, pym, ver: unknown; probably an area ID, a delivery type, a pricing flag and a format version
  lifetime: no timestamp; a 3-day-old routeId returned the identical quote
  scope: one per route (servicing location to zip code), not per car
  rule: server-issued only; never built by us, even though the format is readable

# ---------- Derived fields (computed in core.js, never by the model) ----------
derived_fields:
  - name: estimatedTotal
    formula: price.total + price.estimatedTaxesAndFees
    available_from: [search, vehicle_pricing]
    display: always labeled as an estimate

# ---------- Grounding and safety rules ----------
id_rules:
  recorded_per_session: [vehicleId, stockNumber, routeId, suggestionId]
  accept_only_recorded_ids: true      # tool calls and presentation calls
  scripts_can_add_ids: false
  checked_by: [agentic_brain, core_js]

sanitizer:
  applies_to: [reviews.review_text, free-text vehicle fields, page context sent in step 2, goals from external agents]
  removes: [control and bidirectional characters, fake conversation turns, fake tool calls, fence lookalikes]
  max_length: TBD
  output: wrapped in a fence with a fixed label; the system prompt treats fenced text as material, never instructions

financing_figures:
  fields: [price.monthlyPayment, price.apr, price.term, price.downPayment]
  mini_version: hidden                # not shown, and not used to filter or rank in answers
  when_enabled: Carvana's disclosure wording, captured verbatim and versioned; the model picks which applies and never rewrites it; evals compare it exactly
  needs: review by counsel (Regulation Z disclosure rules)

request_identity:                     # decision D4
  send_only_required_fields: true
  ids: fresh random visitor and correlation IDs per session
  never: reuse a visitor ID recorded from a real user

zip_code:
  source: page context, or asked from the user
  never: the browser's own location (phase 0 saw 94087 instead of 94402)

call_budget:                          # shared by direct, parallel and script calls
  per_task: 60
  per_session: TBD from real usage
  per_day: TBD from real usage
  rate: 1-2 calls per second, one token bucket per session
  repeated_requests: served from cache
  exhaustive_search: filter on search fields first, fetch availability only for candidates, and ask the user to narrow when results run past about 25 pages

# ---------- Task-level tools (exposed to the agent) ----------
tools:
  - name: search_vehicles
    description: Search vehicles for sale with structured filters; returns a trimmed list and the valid values for each filter
    composes: [search, search_facets]
    inputs: {make, model, year_min, year_max, mileage_max, price_max, colors, interior_colors, drive_types, body_styles, sort, zip5}
    output_projection: [vehicleId, stockNumber, year, make, model, trim, mileage, color, price.total, price.estimatedTaxesAndFees, estimatedTotal, locationId, deep_link]
    side_effect: read
    default_presentation: present_vehicles      # used on the fast path
    next_step: "To check delivery dates, call get_delivery_dates once with all the vehicle IDs."
    errors:
      invalid_filter_value: "'{value}' isn't a valid {filter} here. Valid options: {facet_values}."
      no_results: "No vehicles match. Suggest removing one filter; the facet counts show what each option would return."

  - name: get_delivery_dates
    description: Earliest delivery and pickup dates for a list of vehicles, in one call
    composes: [soonest_availability]
    inputs: {vehicleIds (recorded IDs only), zip5}
    output_projection: [vehicleId, delivery.asSoonAsText, delivery.date, delivery.routeId, pickup.asSoonAsText, pickup.locationCity, pickup.routeId]
    side_effect: read
    next_step: "Quote only cars the user opens; get_vehicle_quote needs the routeId of the option they're considering (delivery or pickup)."

  - name: suggest_refinements
    description: Filter suggestions that narrow the current results
    composes: [suggest_filters]
    side_effect: read
    default_presentation: present_filter_suggestions

  - name: get_vehicle_quote
    description: Quote card for one car the user opened - price, estimated taxes and fees, estimated total, delivery date, GAP waiver availability and price. Search already returns the same price and estimated taxes and fees
    composes: [soonest_availability, vehicle_pricing, gap_waiver]
    inputs: {vehicleId, zip5}
    output_projection: [price.total, price.estimatedTaxesAndFees, estimatedTotal, delivery.asSoonAsText, gap.available, gap.price]
    hidden_in_mini_version: [price.monthlyPayment, price.apr, price.term]
    side_effect: read
    default_presentation: present_quote
    errors:
      route_other_zip: "This route is for a different zip code. Call get_delivery_dates for this car at {zip5}, then quote again."
      pricing_error: "Carvana couldn't price this car for zip {zip5}. Tell the user and offer the car's page link."

  - name: compare_vehicles
    description: 2-4 cars side by side
    composes: [get_vehicle_quote x N, reviews]
    side_effect: read
    default_presentation: present_comparison

  - name: get_owner_reviews
    composes: [reviews]
    side_effect: read
    sanitize: always

  - name: vehicle_details
    description: Details for one car from its vehicle page - VIN, features, imperfections, options, packages, highlights
    composes: [vehicle_page]
    inputs: {vehicleId (recorded IDs only)}
    output_projection: [vin, "features (names by category)", "imperfections (title, description, location)", options, packages, highlights]
    side_effect: read
    sanitize: always
    errors:
      not_found: "This car's page isn't available anymore. It may have sold; tell the user and offer similar cars."
      format_changed: "Car details are unavailable right now. Answer without them and say so."

  - name: find_similar
    composes: [similar_vehicles]
    side_effect: read
    default_presentation: present_vehicles

# ---------- Presentation tools (IDs in; core.js fills every displayed field) ----------
presentation_tools:
  - name: present_vehicles
    args: {heading, rows: [vehicleId]}          # ordered as shown on screen
    filled_from_tool_results: [year, make, model, trim, price.total, estimatedTotal (labeled estimate), mileage, delivery date, deep_link]
  - name: present_comparison
    args: {vehicleIds (2-4), attributes (from an allowed list)}
    filled_from_tool_results: [each attribute for each car; missing values shown as "not available"]
  - name: present_quote
    args: {vehicleId}
    filled_from_tool_results: [price.total, price.estimatedTaxesAndFees, estimatedTotal, delivery date, GAP waiver price]
  - name: present_filter_suggestions
    args: {suggestionIds}
    filled_from_tool_results: [label, match count]

# ---------- Errors shared by all tools ----------
common_errors:
  unknown_id: "This ID wasn't returned in this session. Use an ID from the search results."
  budget_reached: "This task reached its call limit. Summarize what you have and offer to continue."
  tool_disabled: "{tool} is unavailable right now. Answer without it and say so."

# ---------- Deep links ----------
# Sources: page URLs seen in the HAR, and Carvana's public .well-known files (fetched 2026-10-08, both HTTP 200)
deep_links:
  web:   # confirmed in the HAR; the agent uses these to send the user back to the same page on the site
    - id: search_results
      url: 'https://www.carvana.com/cars/filters?cvnaid={base64(JSON {"filters": ...})}'
      built_from: search.filters
    - id: vehicle_page
      url: https://www.carvana.com/vehicle/{vehicleId}
      built_from: search.vehicles[].vehicleId
      note: the site appends ?refSource=srp when the user comes from search results

  ios:
    source: https://www.carvana.com/.well-known/apple-app-site-association   # Apple's CDN copy is identical
    app_id: HBB6C66BWR.com.carvana.copilot   # team ID + bundle ID; assumed to be the main Carvana app, not verified
    universal_link_paths:
      - /acquisition/order-placed-dashboard
      - /purchase/order-placed-dashboard
      - /purchase/order-placed
      - /mobile/plaid/oauth/continue          # return step after linking a bank account through Plaid
    note: the file has a trailing comma after the last path; strict JSON parsers reject it, and whether iOS accepts it is unverified

  android:
    source: https://www.carvana.com/.well-known/assetlinks.json   # Dynamic App Links format, which includes path rules
    apps:
      - package: com.carvana.carvana        # production
        paths:
          - /purchase/steps/order-placed/ ?utm_campaign=t_advocate_en_route
        everything_else: excluded
      - package: com.carvana.carvanaTest    # test build
        paths:
          - /acquisition/order-placed-dashboard ?mobileDeepLink=true
          - /purchase/order-placed-dashboard ?mobileDeepLink=true
          - /purchase/steps/order-placed ?mobileDeepLink=true
          - /purchase/steps/order-placed/ ?utm_campaign=t_advocate_en_route
          - /purchase/order-placed ?mobileDeepLink=true
          - /token-validator ?token=*
        everything_else: excluded
        note: looks like Carvana is trying out more app links, switched on per link by mobileDeepLink=true (inference)

  takeaway: >
    On both platforms the app takes over only a few post-purchase pages (plus a Plaid redirect on iOS).
    Vehicle and search links open in the browser even when the app is installed, so Level 0 (deep links)
    reaches almost nothing in Carvana's app today. Internal routes for push notifications almost certainly
    exist but aren't public.

  not_checked:
    - App Links and Smart App Banner meta tags in page HTML (al:ios:url, al:android:url, apple-itunes-app); check in a browser, since curl gets 403
    - custom URL scheme routes (carvana://...); not published anywhere, look in marketing emails, texts and push notifications, or the Android manifest
    - whether each listed path actually opens a native screen; test on devices (adb shell am start on Android, tap from Notes or Messages on iPhone)

# ---------- Access observations ----------
access_notes:
  - Cloudflare returned 403 to curl for HTML pages (/ and /vehicle/4812031) but 200 for the .well-known files; plain scripts calling Carvana from a server are likely to be blocked

# ---------- Not recorded yet (next recording) ----------
gaps:
  - Vehicle detail page (VDP) HTML - the export used the Fetch/XHR filter, so documents weren't captured; detailed specs may be in the server-rendered HTML
  - Financing pre-qualification / soft pull - the page loaded softpull-modal-module, but it wasn't triggered
  - Trade-in valuation
  - Favorites (merch-favorites-mfe) - needs sign-in; the first write action that's safe to record
  - Reserving or buying a car (vehicleLockType and isLockedByCurrentUser suggest a hold flow) - write action; record only up to the confirmation page
